    let portfolioTimers=[];
    function renderPortfolio(){portfolioTimers.forEach(clearInterval);portfolioTimers=[];const absent=lang==='zh'?'图片尚未添加':'Image not added yet';qs('#portfolioList').innerHTML=portfolioData[lang].map((item,index)=>{const [title,count,description,extra]=item;const slides=Array.from({length:count},(_,i)=>{const file=`${index+1}-${i+1}.png`;return `<button class="portfolio-slide ${i===0?'active':''}" type="button" data-slide="${i}" aria-label="${title} — ${i+1}/${count}"><img src="${file}" alt="${title} · ${i+1}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="portfolio-placeholder" hidden>${absent}<br><strong>${file}</strong></span></button>`}).join('');return `<article class="card portfolio-card" data-portfolio="${index}"><div class="portfolio-copy"><div class="meta">${String(index+1).padStart(2,'0')} / ${lang==='zh'?'精选作品':'SELECTED WORK'}</div><h3>${title}</h3><p>${description}</p>${extra}</div><div class="portfolio-carousel"><div class="portfolio-slides">${slides}</div><div class="portfolio-controls"><div class="portfolio-arrows"><button type="button" data-direction="-1" aria-label="Previous image">←</button><button type="button" data-direction="1" aria-label="Next image">→</button></div><span class="portfolio-counter">1 / ${count}</span></div></div></article>`}).join('');qs('#portfolioList').querySelectorAll('[data-portfolio]').forEach(card=>{let active=0;const slides=[...card.querySelectorAll('.portfolio-slide')],counter=card.querySelector('.portfolio-counter');const show=n=>{const next=(n+slides.length)%slides.length;if(next===active)return;const previous=active,oldSlide=slides[previous],newSlide=slides[next];active=next;oldSlide.classList.remove('active');oldSlide.classList.add('leaving');newSlide.classList.remove('leaving');newSlide.classList.add('active');counter.textContent=`${active+1} / ${slides.length}`;setTimeout(()=>oldSlide.classList.remove('leaving'),520)};card.querySelectorAll('[data-direction]').forEach(btn=>btn.onclick=()=>show(active+Number(btn.dataset.direction)));portfolioTimers.push(setInterval(()=>show(active+1),10000))})}
    function renderWorkStages(){const ui=lang==='zh'?{text:'工作内容',visual:'数据图表',curated:'累计梳理',templates:'转化标准模板',count:'数量',step:'阶段',workCount:'累计梳理',million:'百万级播放',manuscripts:'经手稿件',rank:'公司平台排名'}:{text:'Responsibilities',visual:'Visual summary',curated:'Titles reviewed',templates:'Standard templates',count:'Count',step:'Stage',workCount:'Titles catalogued',million:'Million-level views',manuscripts:'Manuscripts handled',rank:'Internal platform ranking'};return workData[lang].stages.map((s,i)=>{let visual='';if(s.bars)visual=`<div class="progress-list">${s.bars.map(x=>`<div class="progress-item"><span>${x[0]}</span><div class="progress-track"><div class="progress-fill" style="width:${x[1]}%"></div></div><strong class="progress-value">${x[1]}%</strong></div>`).join('')}</div>`;if(s.funnel)visual=`<div class="visual-pair"><div><table class="metric-table"><thead><tr><th>${ui.step}</th><th>${ui.count}</th></tr></thead><tbody><tr><td>${ui.curated}</td><td>${s.curated} ${lang==='zh'?'部':'titles'}</td></tr><tr><td>${ui.templates}</td><td>${s.templates}</td></tr></tbody></table></div><div><div class="funnel">${s.funnel.map((x,j)=>`<div class="funnel-step">${x[0]} · ${x[1]}</div>`).join('')}</div></div></div>`;if(s.manuscripts)visual=`<div class="work-output"><div class="matrix-wrap"><strong class="progress-value">${s.manuscripts}</strong><div class="matrix">${Array.from({length:20},()=>'<span></span>').join('')}</div><div class="matrix-caption">${ui.manuscripts}</div></div><div><div class="podium"><div class="podium-step second">2</div><div class="podium-step first">1</div><div class="podium-step third">3</div></div><div class="podium-caption">${ui.rank} · <strong>${s.rank}</strong></div></div></div>`;return `<article class="experience-stage"><div class="stage-title"><h3>${s.company}</h3><span>${s.period}</span></div><div class="stage-panels"><article class="card stage-card"><div class="meta">${ui.text}</div><h4>${s.role}</h4><p class="role-meta">${s.place}</p><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></article><article class="card stage-card"><div class="meta">${ui.visual}</div><h4>${s.chartTitle}</h4>${visual}</article></div></article>`}).join('')}
    function renderCampusStages(){const ui=lang==='zh'?{text:'工作内容',visual:'可视化'}:{text:'Responsibilities',visual:'Visualization'};return campusData[lang].stages.map(s=>`<article class="experience-stage"><div class="stage-title"><h3>${s.company}</h3><span>${s.period}</span></div><div class="stage-panels"><article class="card stage-card"><div class="meta">${ui.text}</div><h4>${s.role}</h4><p class="role-meta">${s.place}</p><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></article><article class="card stage-card"><div class="meta">${ui.visual}</div><h4>${s.chartTitle}</h4><div class="module-grid">${s.modules.map((m,i)=>`<div class="module-tile"><span class="module-index">0${i+1}</span><h5>${m[0]}</h5><p><strong>${m[1]}</strong> · ${m[2]}</p></div>`).join('')}</div></article></div></article>`).join('')}
    function renderGameProjects(){const ui=lang==='zh'?{details:'项目内容',status:'制作进行中',award:'奖项 / 成绩',video:'项目视频'}:{details:'Project details',status:'In production',award:'Award / Grade',video:'Project video'};return gameData[lang].projects.map(p=>{const head=`<div class="game-project-head"><h3>${p.title}</h3><span class="game-period">${p.period}</span></div>`;const details=`<div class="meta">${ui.details}</div>`;const points=`<div class="game-points">${p.points.map(x=>`<div class="game-point"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div>`;if(p.type==='serious')return `<article class="card game-card">${head}${details}${points}<div class="meta">${ui.status}</div><div class="loading-track" role="progressbar" aria-label="${ui.status}" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div></article>`;const isUnity=p.period.startsWith('2025.09');const isJava=p.period.startsWith('2022.04');const videoFile=isUnity?'death-bed.mp4':'java-2d-game.mp4';const awardText=lang==='zh'?(isUnity?'作为课程终评展示材料，获“最受欢迎”奖。':'该项作业获得 100 分，该科成绩为 A。'):(isUnity?'Won “Most Popular” in the course final showcase.':'The assignment received 100/100, and the course grade was A.');const extras=(isUnity||isJava)?`<div class="game-award"><div class="meta">${ui.award}</div><p>${awardText}</p></div><div class="project-video-slot"><div class="meta">${ui.video}</div><video class="project-video" controls playsinline preload="metadata" aria-label="${ui.video}"><source src="${videoFile}" type="video/mp4"></video></div>`:'';return `<article class="card game-card">${head}${details}${points}${extras}<a class="game-link" href="${p.link}" target="_blank" rel="noopener noreferrer">${p.linkLabel} ↗</a></article>`}).join('')}
    function replayEntrance(el){if(!el)return;if(el.classList.contains('section')){el.classList.remove('active');void el.offsetWidth;el.classList.add('active')}else{el.style.animation='none';void el.offsetWidth;el.style.animation=''}}
    function render(){const d=copy[lang],p=profile[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>{if(p[el.dataset.i]!==undefined)el.textContent=p[el.dataset.i];else if(d[el.dataset.i])el.textContent=d[el.dataset.i]});const schoolName=lang==='zh'?'香港中文大学（深圳）':'The Chinese University of Hong Kong, Shenzhen';const leadEl=qs('[data-i=lead]');const schoolAt=p.lead.indexOf(schoolName);const schoolLink=document.createElement('a');schoolLink.className='school-link';schoolLink.href='https://www.cuhk.edu.cn/';schoolLink.target='_blank';schoolLink.rel='noopener noreferrer';schoolLink.textContent=schoolName;const leadTail=p.lead.slice(schoolAt+schoolName.length);const qsNote=lang==='zh'?'（QS 世界大学排名前 50）':' (QS World University Rankings: Top 50)';leadEl.textContent='';leadEl.append(document.createTextNode(p.lead.slice(0,schoolAt)),schoolLink,document.createTextNode(qsNote),document.createTextNode(leadTail));qs('.resume-link').textContent=lang==='zh'?'这是我的中文简历。':'Here is my Chinese résumé.';qs('#nav').innerHTML=d.nav.map((x,i)=>`<button data-section="${sections[i]}" class="${sections[i]===currentSection?'active':''}">${x}</button>`).join('');qs('#educationTimeline').innerHTML=p.educationItems.map(x=>{const key=x[2].includes('Oxford')||x[2].includes('牛津')?'oxford':'cuhksz';return `<div class="timeline-item"><div class="timeline-year">${x[0]}</div><div><h3 class="institution-line">${mark(key,x[2],true)}<strong>${x[2]}</strong></h3><p>${x[1]}</p><p class="sub">${x[3]}</p>${x[4]?`<p class="sub">${x[4]}</p>`:''}</div></div>`}).join('');qs('#skillGroups').innerHTML=p.skillItems.map(x=>`<div class="skill-row"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');qs('#gameChips').innerHTML=p.gameTags.map(x=>`<span class="chip">${x}</span>`).join('');qs('#readerChips').innerHTML=p.readerTags.map(x=>`<span class="chip">${x}</span>`).join('');qs('#hoursChart').innerHTML=p.hours.map(x=>{const key=x[0].toLowerCase().includes('steam')?'steam':x[0].toLowerCase().includes('qidian')||x[0].includes('起点')?'qidian':x[0].toLowerCase().includes('fanqie')||x[0].includes('番茄')?'tomato':'jinjiang';return `<div class="bar-row"><span class="bar-label">${mark(key,x[0])}${x[0]}</span><div class="bar-track" role="img" aria-label="${x[0]}: ${x[1]}"><div class="bar-fill" style="width:${Math.round(x[2]/1500*100)}%"></div></div><strong class="bar-value">${x[1]}</strong></div>`}).join('');qs('#awardsList').innerHTML=p.awardItems.map(x=>`<div class="award"><strong class="award-year">${x[0]}</strong><p>${x[1]}</p></div>`).join('');qs('#workStages').innerHTML=renderWorkStages();qs('#campusStages').innerHTML=renderCampusStages();qs('#gameProjects').innerHTML=renderGameProjects();renderPortfolio();document.title=lang==='en'?'Gong Zirui - Personal Website':'龚子睿-个人网站';document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===currentSection));qs('.intro').style.display=currentSection==='about'?'':'none';replayEntrance(qs('#'+currentSection));if(currentSection==='about')replayEntrance(qs('.intro'));bindNav();}
    function bindNav(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const next=b.dataset.section;if(next===currentSection){replayEntrance(qs('#'+currentSection));if(next==='about')replayEntrance(qs('.intro'));return}const old=qs('#'+currentSection),intro=qs('.intro');old.classList.remove('active','leaving');currentSection=next;const incoming=qs('#'+next);incoming.classList.remove('leaving');incoming.classList.add('active');qs('.intro').classList.remove('leaving');qs('.intro').style.display=next==='about'?'':'none';if(next==='about')replayEntrance(intro);document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('active',n===b));window.scrollTo({top:0,behavior:'smooth'})})}
    qs('#lang').onclick=()=>{lang=lang==='en'?'zh':'en';qs('#lang').textContent=lang==='en'?'中文':'EN';render()};qs('#theme').onclick=()=>{const isLight=document.body.dataset.theme==='light';document.body.dataset.theme=isLight?'dark':'light';qs('#theme').textContent=isLight?'☼':'☾';document.querySelector('meta[name="theme-color"]').content=isLight?'#111310':'#f4f3ed'};
    const lightbox=qs('#portfolioLightbox');document.addEventListener('click',e=>{const portfolioSlide=e.target.closest('.portfolio-slide');if(portfolioSlide){const img=portfolioSlide.querySelector('img');if(img&&!img.hidden&&img.complete&&img.naturalWidth){lightbox.querySelector('img').src=img.src;lightbox.querySelector('img').alt=img.alt;lightbox.classList.add('open')}}if(e.target===lightbox||e.target.closest('#portfolioLightbox button'))lightbox.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('open')});document.addEventListener('click',e=>{const burst=document.createElement('span');burst.className='click-burst';burst.style.left=e.clientX+'px';burst.style.top=e.clientY+'px';const ring=document.createElement('span');ring.className='click-ring';burst.appendChild(ring);for(let i=0;i<8;i++){const angle=(Math.PI*2*i/8)-Math.PI/2;const distance=20+Math.random()*12;const spark=document.createElement('span');spark.className='click-spark';spark.style.setProperty('--dx',Math.cos(angle)*distance+'px');spark.style.setProperty('--dy',Math.sin(angle)*distance+'px');spark.style.animationDelay=(i%2)*25+'ms';burst.appendChild(spark)}document.body.appendChild(burst);setTimeout(()=>burst.remove(),720)});qs('#year').textContent=new Date().getFullYear();render();
